fusioncore:
  ros__parameters:
    base_frame: base_link
    odom_frame: odom
    publish_rate: 30.0

    publish.force_2d: true
    publish.tf: true

    # IMU
    imu.topic: "/bno055/imu"
    imu.gyro_noise: 0.005
    imu.accel_noise: 0.1
    imu.has_magnetometer: true
    imu.remove_gravitational_acceleration: false
    
    # Encoders
    encoder.topic: "/odom"
    encoder.vel_noise: 0.05
    encoder.yaw_noise: 0.02
    encoder.nhc_vy_sigma: 0.05
    encoder.nhc_auto_detect: true

    # GPS
    gnss.fix_topic: "/fix"
    gnss.base_noise_xy: 1.0
    gnss.base_noise_z: 2.0
    gnss.heading_noise: 0.02
    gnss.max_hdop: 4.0
    gnss.min_satellites: 4
    
    # GPS track heading
    gnss.track_heading_enabled: true
    gnss.track_heading_min_dist: 2.0
    gnss.track_heading_max_sigma: 0.4
    gnss.track_heading_min_speed: 0.2

    # Robustness
    outlier_rejection: true
    ground_constraint.vz_sigma: 0.1
    ground_constraint.az_sigma: 0.5
    ground_constraint.z_position_sigma: 0.05
    
    zupt.enabled: true
    
    # Adaptive noise for grass slip
    adaptive.imu: true
    adaptive.encoder: true
    adaptive.gnss: true
    
    # Initialization
    init.wait_for_all_sensors: false
    init.stationary_window: 2.0
    
    # Projection
    input.gnss_crs: "EPSG:4326"
    output.crs: "EPSG:4978"
    output.convert_to_enu_at_reference: true
    reference.use_first_fix: true
